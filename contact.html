<section class="contact">
  <h2 class="section-title">Kontak Saya</h2>

  <div class="contact-container">

    <!-- INFO -->
    <div class="contact-info reveal">
      <h3>Mari Terhubung</h3>
      <p>
        Saya terbuka untuk peluang kerja, kolaborasi proyek, maupun diskusi teknologi.
        Jangan ragu untuk menghubungi saya.
      </p>

      <ul>
        <li><i class="ph ph-envelope"></i> nandanuraziyah@email.com</li>
        <li><i class="ph ph-phone"></i> +62 8xxx xxxx xxx</li>
        <li><i class="ph ph-map-pin"></i> Surakarta, Indonesia</li>
      </ul>

      <div class="socials">
        <a href="https://github.com/aziyah-pixel" target="_blank">
          <i class="ph ph-github-logo"></i>
        </a>
        <a href="#" target="_blank">
          <i class="ph ph-linkedin-logo"></i>
        </a>
        <a href="#" target="_blank">
          <i class="ph ph-instagram-logo"></i>
        </a>
      </div>
    </div>

    <!-- FORM -->
    <form class="contact-form reveal">
      <input type="text" placeholder="Nama Lengkap" required />
      <input type="email" placeholder="Email" required />
      <textarea rows="5" placeholder="Pesan" required></textarea>
      <button type="submit" class="btn">Kirim Pesan</button>
    </form>

  </div>
</section>
